<!-- MODAL NUTRICIÓN CORREGIDO -->
<div id="modal-nutrition" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
  <div class="bg-white border border-pink-200 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
    <div class="flex items-center justify-between pb-2 border-b border-pink-100">
      <h3 class="text-base font-black text-[#2b1120]">Nutrición, Pasos & Macros</h3>
      <button onclick="closeModal('modal-nutrition')" class="text-gray-400 font-bold cursor-pointer">✕</button>
    </div>
    <div class="space-y-3 text-xs">
      <input type="date" id="nutrition-date" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-3 py-2 font-bold">
      <div class="grid grid-cols-2 gap-2">
        <input type="number" id="nutrition-calories" placeholder="Calorías (kcal)" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-3 py-2 font-black">
        <input type="number" id="nutrition-steps" placeholder="Pasos diarios" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-3 py-2 font-bold">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <input type="number" id="nutrition-protein" placeholder="Prot (g)" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-2 py-1.5 font-bold text-center">
        <input type="number" id="nutrition-carbs" placeholder="Carb (g)" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-2 py-1.5 font-bold text-center">
        <input type="number" id="nutrition-fat" placeholder="Grasa (g)" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-2 py-1.5 font-bold text-center">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input type="number" id="nutrition-act-cal" placeholder="Energía de actividad" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-2 py-1.5 font-bold">
        <input type="number" id="nutrition-rest-cal" placeholder="Energía de reposo" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-2 py-1.5 font-bold">
      </div>
      <input type="number" step="0.1" id="nutrition-water" placeholder="Agua (L)" class="w-full bg-[#fff1f6] border border-pink-200 rounded-xl px-3 py-2 font-bold">
    </div>
    <div class="pt-2 flex justify-end space-x-2">
      <button onclick="closeModal('modal-nutrition')" class="px-4 py-2 border border-pink-200 rounded-xl text-xs font-bold cursor-pointer text-gray-600 hover:bg-gray-50">Cancelar</button>
      <button onclick="saveNutritionData()" class="px-4 py-2 bg-[#ec4899] text-white rounded-xl text-xs font-black cursor-pointer hover:opacity-90">Guardar</button>
    </div>
  </div>
</div>
